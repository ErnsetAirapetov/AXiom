name: Задача
description: Атомарная задача доски для агента-исполнителя
title: "[M?-E??-T?] "
body:
  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Зачем это нужно, что уже известно, какие решения приняты ранее.
      placeholder: Ссылки на docs/, соседние задачи, обсуждения.
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Задача
      description: Что конкретно сделать. Одна задача — один результат.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Проверяемые условия готовности. По ним ревьюер принимает работу.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Границы
      description: Что в эту задачу НЕ входит. Что трогать нельзя.
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Модель
      description: Тир модели исполнителя. Перебивает дефолт проекта из .claude/harness.json.
      options:
        - по умолчанию (из harness.json)
        - sonnet
        - opus
        - haiku
    validations:
      required: true
